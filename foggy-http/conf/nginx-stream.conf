# Included inside stream {}. Fixed course code supplies the binary datagram
# as $foggy_packet without consuming it, and a writable $foggy_backend.
server {
    listen 80 udp reuseport;
    preread_by_lua_block {
        local ok, err = require("foggy_router").route({
            -- TODO: map /checkpoint-3/date to 127.0.0.1:8081
            -- TODO: map /checkpoint-3/echo to 127.0.0.1:8082
        })
        if not ok then
            ngx.log(ngx.ERR, "FOGGY_ROUTE rejected: ", err)
            return ngx.exit(ngx.ERROR)
        end
    }
    proxy_pass $foggy_backend;
    proxy_timeout 30s;
    # Leave the UDP response datagram count unlimited (ACKs + data).
}
