# Standard NGINX Stream syntax. The fixed dynamic module supplies the path.
map $foggy_http_path $backend {
    default "";
    # Regex keys preserve case-sensitive HTTP path matching.
    # TODO: route /checkpoint-3/date to 127.0.0.1:8081
    # TODO: route /checkpoint-3/echo to 127.0.0.1:8082
}

server {
    listen 80 udp reuseport;
    proxy_pass $backend;
    proxy_timeout 30s;
}
